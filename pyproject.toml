[project]
name = "method"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.7.0",
    "backoff>=2.2.1",
    # torch/transformers/unsloth/vllm/bitsandbytes are pinned exactly: vllm
    # ships CUDA kernels built against one specific torch release, and vllm's
    # tokenizer caching relies on transformers internals that shift between
    # major versions, so letting the resolver pick each of these
    # independently produces incompatible combinations. These versions are
    # the vendored, known-working set from
    # method/persona_vectors/requirements.txt.
    "bitsandbytes==0.45.5",
    "datasets>=3.6.0",
    "fire>=0.7.0",
    "matplotlib>=3.9.0",
    "openai>=1.70.0",
    "packaging>=25.0",
    "pandas>=2.3.1",
    "peft>=0.15.1",
    "pydantic>=2.11.7",
    "PyYAML>=6.0.2",
    "setuptools>=80.9.0",
    "torch==2.6.0",
    "tqdm>=4.67.1",
    "transformers==4.52.3",
    "trl==0.15.2",
    "unsloth==2025.5.9",
    "vllm==0.8.5.post1",
    "pandas-stubs (>=3.0.3.260530,<4.0.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = "^method/persona_vectors/"

[[tool.mypy.overrides]]
# These ship no type stubs; installing stub packages for them buys nothing.
# "judge", "eval.*" and "generate_vec" are vendored persona_vectors modules,
# importable only once their directory is on sys.path (the workers put it
# there at runtime), so mypy cannot resolve them from here.
module = [
    "tqdm.*",
    "transformers.*",
    "peft.*",
    "vllm.*",
    "unsloth.*",
    "datasets.*",
    "judge",
    "eval.*",
    "generate_vec",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0412",
    "C0413",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "wrong-import-order",
    "import-outside-toplevel",
]
